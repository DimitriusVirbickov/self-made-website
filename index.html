/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  document.documentElement.lang = L || 'nl';
  if (!L) {
    document.title = 'Theater & Praktijk · Theatre & Practice';
    app.innerHTML = `<main class="landing"><a class="nl" href="#/nl/home" lang="nl"><span class="big">Theater &amp; Praktijk</span><small>Minor van de HvA. Nederlandstalig, sep t/m jan.</small></a><a class="en" href="#/en/home" lang="en"><span class="big">Theatre &amp; Practice</span><small>HvA minor. English-taught, Feb to Jun.</small></a></main>`;
    return
  }
  document.title = t('Theater & Praktijk · HvA minor', 'Theatre & Practice · HvA minor');
  const other = L === 'nl' ? 'en' : 'nl';
  app.innerHTML = `<header class="top"><div class="wrap"><a class="logo" href="${href('home')}">🎭 ${t('Theater & Praktijk','Theatre & Practice')}</a>
 <nav aria-label="${t('Hoofdmenu','Main menu')}">${PAGES.map(p=>`<a href="${href(p[0])}"${p[0]===pg?' aria-current="page"':''}>${t(p[1],p[2])}</a>`).join('')}</nav>
 <a class="lang" href="#/${other}/${pg}" hreflang="${other}">${other.toUpperCase()}</a></div></header>
 <main>${(V[pg]||V.home)()}</main>
 <footer><div class="wrap"><span>${t('Minor Theater & Praktijk · Hogeschool van Amsterdam','Minor Theatre & Practice · Amsterdam University of Applied Sciences')}</span>
 <label class="adm"><input type="checkbox" id="adm"${admin?' checked':''}> ${t('Beheer','Manage')}</label></div></footer>`;
  bind();
  rotate();
}

function bind() {
  const $ = s => document.querySelector(s);
  $('#adm').onchange = e => {
    admin = e.target.checked;
    render()
  };
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open));
  document.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
    moved.add(b.dataset.move);
    save();
    render()
  });
  const ma = $('[data-moveall]');
  if (ma) ma.onclick = () => {
    PRODS.filter(isCur).forEach(p => moved.add(p.id));
    save();
    render()
  };
  const fq = $('#fq');
  if (fq) {
    fq.oninput = e => {
      F.q = e.target.value;
      render();
      const n = $('#fq');
      n.focus();
      n.setSelectionRange(F.q.length, F.q.length)
    };
    $('#fy').onchange = e => {
      F.year = e.target.value;
      render()
    };
    $('#ft').onchange = e => {
      F.track = e.target.value;
      render()
    }
  }
}

function open(id) {
  const p = PRODS.find(x => x.id === id),
    i = PRODS.indexOf(p),
    d = document.getElementById('dlg');
  d.innerHTML = `<div class="in"><div class="poster p${i%4} poster-wide"><small>${p.year}</small><strong>${p.title}</strong></div>
 <p><span class="tag">${trackName(p.track)}</span><span class="tag">${p.year}</span><span class="tag">Crea Theater</span></p>
 <p>${t(p.nl,p.en)}</p><p><b>${t('Makers','Makers')}:</b> ${p.who}</p>
 <p class="note">${t('Hier komen foto’s, affiche, video’s en programma.','Photos, poster, videos and programme go here.')}</p>
 <button class="btn sm" id="cl">${t('Sluiten','Close')}</button></div>`;
  d.showModal();
  document.getElementById('cl').onclick = () => d.close()
}
let timer;

function rotate() {
  clearTimeout(timer);
  const el = document.getElementById('rot');
  if (!el) return;
  let i = 0;
  (function n() {
